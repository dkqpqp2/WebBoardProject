<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>정보공유 게시판</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <div th:replace="~{fragments/authbar :: authbar}"></div>
    <h1><a th:href="@{/board/list}">정보공유 게시판</a></h1>
    <nav>
        <a th:href="@{/board/list(keyword=${keyword}, searchType=${searchType})}"
           th:classappend="${selectedCategory == null} ? 'active' : ''">전체</a>
        <a th:each="entry : ${categoryMap}"
           th:href="@{/board/list(category=${entry.key}, keyword=${keyword}, searchType=${searchType})}"
           th:text="${entry.value}"
           th:classappend="${selectedCategory == entry.key} ? 'active' : ''"></a>
    </nav>
</header>

<main>
    <form th:action="@{/board/list}" method="get" class="search-form">
        <input type="hidden" name="category" th:value="${selectedCategory}">
        <select name="searchType">
            <option value="all" th:selected="${searchType == null or searchType == 'all'}">전체</option>
            <option value="title" th:selected="${searchType == 'title'}">제목</option>
            <option value="writer" th:selected="${searchType == 'writer'}">작성자</option>
            <option value="content" th:selected="${searchType == 'content'}">내용</option>
        </select>
        <input type="text" name="keyword" th:value="${keyword}" placeholder="검색어 입력">
        <button type="submit">검색</button>
    </form>

    <table>
        <thead>
        <tr>
            <th>번호</th>
            <th>카테고리</th>
            <th>제목</th>
            <th>글쓴이</th>
            <th>조회수</th>
            <th>작성일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="board : ${boardList}">
            <td th:text="${board.boardSeq}"></td>
            <td th:text="${categoryMap.get(board.category)}"></td>
            <td>
                <a th:href="@{/board/detail/{id}(id=${board.boardSeq})}" th:text="${board.boardTitle}"></a>
            </td>
            <td th:text="${board.userName}"></td>
            <td th:text="${board.viewCount}"></td>
            <td th:text="${#temporals.format(board.boardWritedate, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(boardList)}">
            <td colspan="6">게시글이 없습니다.</td>
        </tr>
        </tbody>
    </table>
    <div class="pagination">
        <a th:if="${startPage > 1}"
           th:href="@{/board/list(category=${selectedCategory}, keyword=${keyword}, searchType=${searchType}, page=${startPage - 1})}">&lt;</a>
        <span th:unless="${startPage > 1}" class="disabled">&lt;</span>

        <a th:each="i : ${#numbers.sequence(startPage, endPage)}"
           th:href="@{/board/list(category=${selectedCategory}, keyword=${keyword}, searchType=${searchType}, page=${i})}"
           th:text="${i}"
           th:classappend="${i == currentPage} ? 'active' : ''"></a>

        <a th:if="${endPage < totalPage}"
           th:href="@{/board/list(category=${selectedCategory}, keyword=${keyword}, searchType=${searchType}, page=${endPage + 1})}">&gt;</a>
        <span th:unless="${endPage < totalPage}" class="disabled">&gt;</span>
    </div>

    <a class="btn" th:href="@{/board/write}">글쓰기</a>
</main>
</body>
</html>
